name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Verify gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

  lint:
    name: golangci-lint (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg VERSION=ci-${{ github.sha }} -t hedge-llm:ci .

      # The point of the version stamp is that a running container can say
      # which build it is. Assert it, so a broken -ldflags line fails CI
      # instead of shipping an image that reports "dev".
      - name: Assert the version stamp reached the binary
        run: |
          got="$(docker run --rm hedge-llm:ci -version)"
          want="ci-${{ github.sha }}"
          if [ "$got" != "$want" ]; then
            echo "-version printed '$got', want '$want'"
            exit 1
          fi

      - name: Assert the image does not run as root
        run: |
          uid="$(docker image inspect hedge-llm:ci --format '{{.Config.User}}')"
          if [ -z "$uid" ] || [ "$uid" = "root" ] || [ "$uid" = "0" ]; then
            echo "image runs as '$uid', want a non-root user"
            exit 1
          fi
